apiVersion: 1

datasources:
  - name: Loki
    uid: nextcloud-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    version: 1

  - name: Zabbix
    uid: nextcloud-zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      authType: userLogin
      username: Admin
      trends: false
    secureJsonData:
      password: $ZABBIX_UI_PASSWORD
    editable: true
    version: 1
