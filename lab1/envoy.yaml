static_resources:
  listeners:
    - name: postgres
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 5432
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: postgres
                cluster: postgres_primary
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] upstream=%UPSTREAM_HOST% flags=%RESPONSE_FLAGS% duration_ms=%DURATION%\n"

  clusters:
    - name: postgres_primary
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      dns_refresh_rate: 2s
      connect_timeout: 2s
      load_assignment:
        cluster_name: postgres_primary
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: pg1
                      port_value: 5432
                  health_check_config:
                    port_value: 8008
              - endpoint:
                  address:
                    socket_address:
                      address: pg2
                      port_value: 5432
                  health_check_config:
                    port_value: 8008
      common_lb_config:
        healthy_panic_threshold:
          value: 0
      close_connections_on_host_health_failure: true
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          http_health_check:
            path: /primary
