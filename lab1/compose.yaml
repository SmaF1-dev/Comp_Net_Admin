name: comp-net-admin-lab1

x-etcd-environment: &etcd-environment
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: comp-net-admin-lab1

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.7.4
  entrypoint: ["/usr/local/bin/etcd"]
  healthcheck:
    test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
    interval: 3s
    timeout: 3s
    retries: 20

x-patroni-environment: &patroni-environment
  PATRONI_SUPERUSER_PASSWORD: ${LAB1_POSTGRES_PASSWORD:-lab1-postgres}
  PATRONI_REPLICATION_PASSWORD: ${LAB1_REPLICATION_PASSWORD:-lab1-replicator}

x-patroni: &patroni
  image: comp-net-admin-lab1-patroni:pg18.7-p4.1.5
  depends_on:
    etcd1:
      condition: service_healthy
    etcd2:
      condition: service_healthy
    etcd3:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8008/health', timeout=2).close()"]
    interval: 3s
    timeout: 3s
    retries: 30
  stop_grace_period: 30s

services:
  etcd1:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
    volumes:
      - etcd1-data:/etcd-data

  etcd2:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
    volumes:
      - etcd2-data:/etcd-data

  etcd3:
    <<: *etcd
    environment:
      <<: *etcd-environment
      ETCD_NAME: etcd3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
    volumes:
      - etcd3-data:/etcd-data

  pg1:
    <<: *patroni
    build: .
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
    volumes:
      - pg1-data:/var/lib/postgresql

  pg2:
    <<: *patroni
    pull_policy: never
    environment:
      <<: *patroni-environment
      PATRONI_NAME: pg2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
    volumes:
      - pg2-data:/var/lib/postgresql

  envoy:
    image: envoyproxy/envoy:v1.37.10
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - type: bind
        source: ./envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
        bind:
          create_host_path: false

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
